name: Slot Monitor

# Polls Playtomic availability for the configured clubs/time windows every 10
# minutes and sends a Telegram message when new matching slots appear.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: slot-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Write config from repository variable
        env:
          MONITOR_CONFIG: ${{ vars.MONITOR_CONFIG }}
        run: |
          if [ -z "$MONITOR_CONFIG" ]; then
            echo "::error::repository variable MONITOR_CONFIG is empty"
            exit 1
          fi
          printf '%s' "$MONITOR_CONFIG" > config.json

      - name: Validate config
        run: go run ./cmd/slot-monitor -validate -config config.json

      - name: Restore state
        uses: actions/cache/restore@v5
        with:
          path: state/seen.json
          key: slot-monitor-state-${{ github.run_id }}
          restore-keys: |
            slot-monitor-state-

      - name: Run monitor
        env:
          PLAYTOMIC_EMAIL: ${{ secrets.PLAYTOMIC_EMAIL }}
          PLAYTOMIC_PASSWORD: ${{ secrets.PLAYTOMIC_PASSWORD }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: go run ./cmd/slot-monitor -config config.json -state state/seen.json

      - name: Save state
        if: always()
        uses: actions/cache/save@v5
        with:
          path: state/seen.json
          key: slot-monitor-state-${{ github.run_id }}
